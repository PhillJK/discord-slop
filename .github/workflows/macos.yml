# Builds the qchat desktop client for macOS on Apple Silicon (arm64).
#
# openh264 uses its ARM assembly on arm64, built by the Xcode toolchain, so no
# extra tools (nasm) are needed. cmake (for Opus) is preinstalled on the runner.
# The result is uploaded as a workflow artifact (tar.gz, keeps the executable bit).

name: macOS client

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: arm64 binary
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release -p qchat-client --target aarch64-apple-darwin

      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/qchat dist/qchat
          file dist/qchat
          tar -C dist -czf qchat-macos-arm64.tar.gz qchat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qchat-macos-arm64
          path: qchat-macos-arm64.tar.gz
          if-no-files-found: error
